name: Android quality

on:
  pull_request:
    branches:
      - develop
      - qa
      - main
  push:
    branches:
      - develop
      - qa
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
